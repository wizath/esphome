esphome:
  name: addrspi2-test

esp32:
  board: esp32dev
  framework:
    type: esp-idf

addrspi2:
  id: moduliq_head
  cs_pin: ${cs_pin}
  devices:
    - id: head_dac
      address: 0x00
    - id: head_adc
      address: 0x01

interval:
  - interval: 60s
    then:
      - lambda: |-
          uint8_t dac_payload[3] = {0x08, 0x80, 0x00};
          id(head_dac).write_transaction(dac_payload, sizeof(dac_payload));

          uint8_t adc_tx[2] = {0x00, 0x00};
          uint8_t adc_rx[2] = {};
          id(head_adc).transfer_transaction(adc_tx, adc_rx, sizeof(adc_tx));
