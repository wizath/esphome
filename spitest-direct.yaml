esphome:
  name: spi-test-direct
  friendly_name: HC138 Direct SPI Test

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG
  baud_rate: 115200

# Shared SPI bus - HSPI (ESP32 pins: GPIO14=CLK, GPIO12=MISO, GPIO13=MOSI)
spi:
  id: spi_bus
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin: GPIO12

# HC138 SPI multiplexer - direct approach, no channels
hc138:
  id: mux
  spi_id: spi_bus
  cs_pin: GPIO15        # Shared CS pin for all devices
  spi_mode: MODE1        # Custom SPI mode (default would be MODE0)
  data_rate: 4MHz        # Custom data rate (default would be 1MHz)
  bit_order: lsb_first   # Custom bit order (default would be msb_first)
  a0: GPIO2   # Address pin A0 = P0 == IO2
  a1: GPIO4   # Address pin A1 = P1 == IO4
  a2: GPIO16  # Address pin A2 = P2 == IO16

# Test with single SPI device directly on HC138
spi_test:
  - id: test_device
    spi_id: mux  # Direct reference to HC138 component
