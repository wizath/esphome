esphome:
  name: mmc5983-test
  friendly_name: MMC5983 Magnetometer Test

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  hardware_uart: UART0
  baud_rate: 115200

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11
  miso_pin: GPIO13

mmc5983:
  id: mag_sensor
  cs_pin: GPIO10
  update_interval: 1s

sensor:
  - platform: mmc5983
    field_strength_x:
      name: "Magnetic Field X"
    field_strength_y:
      name: "Magnetic Field Y"
    field_strength_z:
      name: "Magnetic Field Z"
    temperature:
      name: "Magnetometer Temperature"
