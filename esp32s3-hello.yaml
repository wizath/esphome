esphome:
  name: esp32s3-hello
  friendly_name: ESP32-S3 Hello World

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# Enable logging
logger:
  level: DEBUG
  hardware_uart: UART0
  baud_rate: 115200

# Status LED
status_led:
  pin: GPIO48

# Example: Add a sensor to test
sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 5s
