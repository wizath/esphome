spi:
  id: spi_bus
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

addrspi2:
  id: moduliq_head
  spi_id: spi_bus
  cs_pin: GPIO5
  devices:
    - bus_id: head_dac_spi
      address: 0x00
    - bus_id: head_adc_spi
      address: 0x01

# Normal SPI drivers can use one of the virtual buses above:
#
# dacx0504:
#   spi_id: head_dac_spi
#   cs_pin:
#     number: GPIO5
#     allow_other_uses: true
#
# ads8166:
#   spi_id: head_adc_spi
#   cs_pin:
#     number: GPIO5
#     allow_other_uses: true
#
# The child cs_pin is kept for driver schema compatibility; addrspi2 uses the
# hub cs_pin so the address byte and payload stay in one CS-low frame.

interval:
  - interval: 10s
    then:
      - lambda: |-
          uint8_t dac_payload[3] = {0x08, 0x80, 0x00};
          id(head_dac_spi).write_transaction(dac_payload, sizeof(dac_payload));

          uint8_t adc_tx[2] = {0x00, 0x00};
          uint8_t adc_rx[2] = {};
          id(head_adc_spi).transfer_transaction(adc_tx, adc_rx, sizeof(adc_tx));
